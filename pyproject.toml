[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdbuddy"
version = "0.1.0"
description = "PowerShell-first AI command assistant for developers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CmdBuddy Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cmb = "cmdbuddy.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["cmdbuddy*"]
